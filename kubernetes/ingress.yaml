apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-platform
  namespace: inventory
spec:
  ingressClassName: nginx
  rules:
    - host: inventory.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-dashboard
                port:
                  name: http
